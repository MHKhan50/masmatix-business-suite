spring:
  application:
    name: masmatix-business-suite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/suite}
    username: ${DB_USER:suite}
    password: ${DB_PASSWORD:suite}
  jpa:
    hibernate:
      ddl-auto: update        # fine for a demo; a production install would use Flyway migrations
    open-in-view: true
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    ttl-minutes: 480
  seed:
    enabled: ${APP_SEED:true}
    demo-password: ${APP_DEMO_PASSWORD:}
  timezone: ${APP_TIMEZONE:Europe/London}
  currency: ${APP_CURRENCY:GBP}
  pos:
    shop-name: ${APP_SHOP_NAME:Corner Shop (demo)}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints.web.exposure.include: health
